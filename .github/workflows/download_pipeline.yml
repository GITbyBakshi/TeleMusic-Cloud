name: Auto Music Downloader

on:
  schedule:
    - cron: '0 */6 * * *'  # Automatically checks for new songs every 6 hours
  workflow_dispatch:      # Allows manual triggers anytime from the Actions tab

jobs:
  fetch-and-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Grants permission to save uploaded_tracks.txt back to your repo
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install spotiflac ytmusicapi requests

      - name: Execute Downloader
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python pipeline.py

      - name: Save History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add uploaded_tracks.txt || true
          git commit -m "update uploaded track history" || true
          git push || true
